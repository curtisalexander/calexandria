[package]
name = "calx-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.105"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4"] }
