[package]
name = "calx"
description = "Calexandria, a personal agent harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.105"
calx-core = { version = "0.1.0", path = "../calx-core" }
clap = { version = "4.6.10", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
edtui = { version = "0.11.9", default-features = false }
futures-util = "0.3.34"
open = "5.4.5"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
