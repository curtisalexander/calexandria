[package]
name = "calx"
description = "Calexandria, a personal agent harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.105"
calx-core = { version = "0.1.0", path = "../calx-core" }
clap = { version = "4.6.10", features = ["derive", "env"] }
open = "5.4.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
